name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build · vet · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  integration:
    name: Backend integration (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ar
          POSTGRES_PASSWORD: ar
          POSTGRES_DB: ar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ar" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: "postgres://ar:ar@localhost:5432/ar?sslmode=disable"
          REDIS_URL: "redis://localhost:6379/0"
        run: go test -tags=integration ./internal/integration/

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ar-backend:ci ./backend

  agent-core:
    name: Windows agent core (.NET build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # AR.Agent.Core targets net8.0 (no Windows APIs), so it builds and tests on
      # Linux. The WinUI shell (AR.Agent.App) is Windows-only and excluded here.
      - name: Restore & test core
        run: |
          dotnet test windows-agent/tests/AR.Agent.Core.Tests/AR.Agent.Core.Tests.csproj \
            --configuration Release

  webrtc-interop:
    name: WebRTC interop harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install harness deps
        working-directory: interop-harness
        run: npm ci
      # Builds the DB-free signaling relay, runs two werift peers through it, and
      # asserts the handshake, VP8+Opus negotiation, and data-channel delivery.
      - name: Run interop harness
        working-directory: interop-harness
        run: ./run.sh
