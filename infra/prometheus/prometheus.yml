# Scrapes the backend's /metrics over the internal compose network (no TLS/auth
# needed internally). Grafana reads from this Prometheus at http://prometheus:9090.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ar-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
