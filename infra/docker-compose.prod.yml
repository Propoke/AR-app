# Production compose. Two access scenarios, one file:
#
#   1. WireGuard / LAN (start here): clients reach the backend directly over the
#      trusted tunnel. The tunnel already encrypts, so TLS is optional.
#        docker compose -f docker-compose.prod.yml up -d
#      Clients use http://<vm-ip>:8080 and ws://<vm-ip>:8080.
#
#   2. External / public (later): add Caddy for automatic HTTPS and expose it.
#        docker compose -f docker-compose.prod.yml --profile tls up -d
#      Clients use https://$DOMAIN and wss://$DOMAIN.
#
# coturn's TURN_EXTERNAL_IP must be the address clients reach it on:
#   - WireGuard/LAN: the VM's tunnel/LAN IP.
#   - External:      the WAN/public IP, with UDP 3478 + the relay range forwarded.
# Postgres/Redis ports are never published; the backend and Grafana are reachable
# over the tunnel/LAN only (do not forward 8080/3000 to the internet).

services:
  # TLS reverse proxy — only started with `--profile tls` (external scenario).
  caddy:
    image: caddy:2
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    # Published so clients reach it directly over the WireGuard tunnel / LAN. In the
    # external scenario, simply do not forward this port to the internet (traffic
    # goes through Caddy on 443 instead).
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:?set a strong secret}"
      SESSION_TOKEN_TTL: "${SESSION_TOKEN_TTL:-10m}"
      SIGNALING_TOKEN_TTL: "${SIGNALING_TOKEN_TTL:-4h}"
      SIGNALING_FANOUT: "${SIGNALING_FANOUT:-local}"
      TURN_SECRET: "${TURN_SECRET:?}"
      TURN_REALM: "${TURN_REALM:-ar.local}"
      TURN_URLS: "${TURN_URLS:?e.g. turn:10.8.0.1:3478?transport=udp}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # Host networking so coturn can allocate relay ports directly. TURN_EXTERNAL_IP
    # must be the address clients reach it on; the auth secret comes from the
    # environment so it always matches the backend's TURN_SECRET.
    network_mode: host
    command:
      - "-n"                                             # ignore any distro config file
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:?}"
      - "--realm=${TURN_REALM:-ar.local}"
      - "--listening-port=3478"
      - "--min-port=${TURN_MIN_PORT:-49160}"
      - "--max-port=${TURN_MAX_PORT:-49200}"
      - "--fingerprint"
      - "--external-ip=${TURN_EXTERNAL_IP:?set to the IP clients reach coturn on}"
      - "--log-file=stdout"
      - "--simple-log"

  # --- Monitoring ---
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    # Scrapes backend:8080/metrics on the internal network; not published.
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # Reachable over the tunnel/LAN. Do NOT forward this to the internet.
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  promdata:
  grafanadata:
