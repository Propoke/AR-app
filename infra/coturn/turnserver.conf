# coturn configuration for local development.
#
# Uses the TURN REST API shared-secret scheme: the backend mints time-limited
# username/credential pairs signed with `static-auth-secret`. Keep this secret in
# sync with the backend's TURN_SECRET environment variable.

listening-port=3478
# tls-listening-port=5349   # enable in production with real certs

fingerprint
use-auth-secret
static-auth-secret=dev-turn-secret
realm=ar.local

# Relay port range opened to the public in production (mirror in the firewall).
min-port=49160
max-port=49200

# Quieten logs for local dev.
no-cli
log-file=stdout
simple-log

# Local development convenience. In production, set listening-ip / relay-ip /
# external-ip to the host's real addresses and remove these allowances.
no-tlsv1
no-tlsv1_1
